{% if paragraph.kind == 'heading' %}<h2 {% if companion %}data-companion-anchor="{{ paragraph.anchor_id }}"{% else %}id="anchor-{{ paragraph.anchor_id }}" data-anchor="{{ paragraph.anchor_id }}"{% endif %}>{{ paragraph.text }}</h2>{% else %}<p {% if companion %}data-companion-anchor="{{ paragraph.anchor_id }}"{% else %}id="anchor-{{ paragraph.anchor_id }}" data-anchor="{{ paragraph.anchor_id }}"{% endif %}{% if paragraph.kind == 'verse' %} class="verse"{% elif paragraph.kind == 'note' %} class="footnote" role="note"{% endif %}>{{ paragraph.text }}</p>{% endif %}
