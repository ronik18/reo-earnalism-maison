{% extends 'web/base.html' %}{% load maison %}{% block content %}<div class="page-title"><p class="eyebrow">{% ui 'vault' %}</p><h1>{% ui 'your_collection' %}</h1></div><nav class="tabs" aria-label="{% ui 'vault' %}"><a href="?tab=saved" {% if vault_tab == 'saved' %}aria-current="page"{% endif %}>{% ui 'saved' %}</a><a href="?tab=finished" {% if vault_tab == 'finished' %}aria-current="page"{% endif %}>{% ui 'finished' %}</a><a href="?tab=lists" {% if vault_tab == 'lists' %}aria-current="page"{% endif %}>{% ui 'lists' %}</a><a href="{% url 'web:downloads' ui_locale %}">{% ui 'downloads' %}</a></nav><section id="vault-content" data-tab="{{ vault_tab }}"><p role="status" id="vault-status">{% ui 'loading' %}</p><div id="vault-items" class="stack"></div>{% if vault_tab == 'lists' %}<form id="create-list-form" class="inline-form"><label>{% ui 'list_name' %}<input name="name" maxlength="80" required></label><button class="button" type="submit">{% ui 'new_list' %}</button></form>{% endif %}</section>{% endblock %}
