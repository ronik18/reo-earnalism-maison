name: Local-first application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postgres-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
        env:
          POSTGRES_USER: maison
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: maison
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U maison -d maison"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      MAISON_ENV: test
      DATABASE_URL: postgres://maison:ephemeral-ci-only@127.0.0.1:5432/maison?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test --noinput --verbosity 2
