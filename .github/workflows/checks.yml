name: Local-first application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postgres-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          POSTGRES_USER: maison
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: maison
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U maison -d maison"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      MAISON_ENV: test
      DATABASE_URL: postgres://maison:ephemeral-ci-only@127.0.0.1:5432/maison?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: python manage.py check
      - run: python -m unittest discover -s skills/earnalism-audiobook-go-live/scripts -p 'test_plan_voice.py'
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test --noinput --verbosity 2
