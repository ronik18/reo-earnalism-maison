{% extends 'web/base.html' %}{% load maison %}{% block content %}<section id="personal-list" data-list-id="{{ list_id }}"><a href="{% url 'web:vault' ui_locale %}?tab=lists">{% ui 'back' %}</a><h1 id="list-title">{% ui 'lists' %}</h1><p role="status" id="list-status">{% ui 'loading' %}</p><form id="rename-list-form" class="inline-form"><label>{% ui 'list_name' %}<input name="name" maxlength="80" required></label><button type="submit">{% ui 'rename' %}</button></form><div id="list-items" class="stack"></div><form id="add-list-item-form"><label>{% ui 'add_to_list' %}<select name="edition_id" required id="list-edition-options">{% for edition in available_editions %}<option value="{{ edition.edition_id }}">{{ edition.title }}</option>{% endfor %}</select></label><button type="submit">{% ui 'save' %}</button></form><details><summary>{% ui 'delete_list' %}</summary><button id="delete-list" type="button">{% ui 'confirm_delete' %}</button></details></section>{% endblock %}
