  "info": {
    "title": "Earnalism Maison API",
    "version": "1.1.1",
    "description": "Implementation contract,17Nov2026. One Django application, same-origin /api/v1. Design only, no deployed endpoint claims. PublicUUID4,UTC timestamps,snake_case,en/bn. Session cookie+CSRF, not app bearerJWT. Monetary values exclusively server-owned approved terms. Examples use fictional IDs/example domains, never productiondata or approved prices. India-first service rollout has one provider-independent direct parent-permission route; edition publication territory/rights policy remains separate and unchanged."
  },
  "servers": [
    {
      "url": "/api/v1",
      "description": "Same-origin production/staging base; browser credentials=same-origin."
    }
  ],
