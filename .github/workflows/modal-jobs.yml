# Runs queued eav Modal GPU jobs (narration, stills, music) on a GitHub-hosted runner, which can
# reach Modal; the Claude session cannot. A request is written by `eav modal-request` (it checks the
# Modal dollar caps and records the worst-case pending row on the ledger first) and pushed by root.
# Per request: probe R2 (refuse before any paid run if it fails), run on Modal (caps re-checked for
# the current UTC month), upload the outputs to the private R2 bucket, push the result back.
# `eav modal-fetch` brings the outputs back for `eav import`. Each step gets only the secrets it
# needs. The Modal workspace spend limit is the backstop behind the ledger's caps.
name: Modal GPU jobs
on:
  push:
    branches: [claude/wonderful-bardeen-s9k90x]
    paths: ['production/audiovisual/modal-requests/*.json', '.github/workflows/modal-jobs.yml']
permissions:
  contents: write
concurrency:
  group: modal-jobs
  cancel-in-progress: false
env:
  BRANCH: claude/wonderful-bardeen-s9k90x
jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      requests: ${{ steps.ls.outputs.requests }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: claude/wonderful-bardeen-s9k90x
      - id: ls
        run: |
          set -euo pipefail
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import glob, json
          ids = []
          for p in sorted(glob.glob("production/audiovisual/modal-requests/*.json")):
              d = json.load(open(p))
              if d.get("status") == "requested":
                  ids.append(d["job_id"])
          print("requests=" + json.dumps(ids))
          PY
  run:
    needs: list
    if: needs.list.outputs.requests != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        job_id: ${{ fromJSON(needs.list.outputs.requests) }}
    env:
      JOB_ID: ${{ matrix.job_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: claude/wonderful-bardeen-s9k90x
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the Modal client (no secrets in this step)
        run: pip install modal==1.6.4 numpy==2.5.3 pillow==13.0.0
      - name: Mark the request running
        id: start
        run: |
          set -euo pipefail
          git config user.name "eav modal-jobs"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          req="production/audiovisual/modal-requests/$JOB_ID.json"
          field() { python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))[sys.argv[2]])' "$1" "$2"; }
          if [ "$(field "$req" status)" != requested ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          root="$GITHUB_WORKSPACE/$(field "$req" title_root)"
          ledger="$(python3 -c 'import json, os, sys; r = sys.argv[1]; print(os.path.normpath(os.path.join(r, json.load(open(os.path.join(r, "record.json")))["ledger"])))' "$root")"
          python3 -c 'import json, sys; p = sys.argv[1]; d = json.load(open(p)); d["status"] = "running"; open(p, "w").write(json.dumps(d, indent=2, sort_keys=True) + "\n")' "$req"
          bash .github/scripts/modal-publish.sh "modal-jobs: $JOB_ID running" "$JOB_ID" "$root" "$ledger" "$req"
          {
            echo "go=true"
            echo "req=$req"
            echo "root=$root"
            echo "ledger=$ledger"
          } >> "$GITHUB_OUTPUT"
      - name: Probe R2 before the paid run
        id: probe
        if: steps.start.outputs.go == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_R2_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          ROOT: ${{ steps.start.outputs.root }}
        run: |
          set -euo pipefail
          cd skills/earnalism-audiovisual/software
          python3 -m eav.cli r2-probe "$JOB_ID" --root "$ROOT"
      - name: Run on Modal
        id: modal
        if: steps.probe.outcome == 'success'
        continue-on-error: true
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          ROOT: ${{ steps.start.outputs.root }}
        run: |
          set -euo pipefail
          cd skills/earnalism-audiovisual/software
          python3 -m eav.cli modal-run "$JOB_ID" --root "$ROOT" --request --download "$RUNNER_TEMP/modal-downloads"
      - name: Upload the outputs to R2
        id: upload
        if: steps.probe.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_R2_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          ROOT: ${{ steps.start.outputs.root }}
        run: |
          set -euo pipefail
          cd skills/earnalism-audiovisual/software
          python3 -m eav.cli r2-upload "$JOB_ID" --root "$ROOT" --from "$RUNNER_TEMP/modal-downloads/$JOB_ID"
      - name: Push the result back (no secrets in this step)
        if: always() && steps.start.outputs.go == 'true'
        env:
          REQ: ${{ steps.start.outputs.req }}
          ROOT: ${{ steps.start.outputs.root }}
          LEDGER: ${{ steps.start.outputs.ledger }}
        run: |
          set -euo pipefail
          status="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["status"])' "$REQ")"
          bash .github/scripts/modal-publish.sh "modal-jobs: $JOB_ID $status" "$JOB_ID" "$ROOT" "$LEDGER" "$REQ"
          if [ "$status" != done ]; then
            echo "Request $JOB_ID ended $status; see the request file"
            exit 1
          fi
