{% extends 'web/base.html' %}{% load maison %}{% block content %}<div class="page-title"><p class="eyebrow">{% ui 'explore' %}</p><h1>{% ui 'search_title' %}</h1></div>
<form method="get" class="search-form"><label class="search-query">{% ui 'search_query' %}<input name="q" type="search" maxlength="120" value="{{ selected.q }}"></label>
<details class="filters" open><summary>{% ui 'apply_filters' %}</summary><div class="form-grid">
<label>{% ui 'content_language' %}<select name="content_locale"><option value="en" {% if content_locale == 'en' %}selected{% endif %}>English</option><option value="bn" {% if content_locale == 'bn' %}selected{% endif %}>বাংলা</option></select></label>
<label>{% ui 'format' %}<select name="format"><option value="">{% ui 'all' %}</option><option value="reader" {% if selected.format == 'reader' %}selected{% endif %}>{% ui 'read' %}</option><option value="audio" {% if selected.format == 'audio' %}selected{% endif %}>{% ui 'listen' %}</option><option value="video" {% if selected.format == 'video' %}selected{% endif %}>{% ui 'watch' %}</option></select></label>
<label>{% ui 'house' %}<select name="house"><option value="">{% ui 'all' %}</option><option value="classics" {% if selected.house == 'classics' %}selected{% endif %}>{% ui 'classics' %}</option><option value="golpo" {% if selected.house == 'golpo' %}selected{% endif %}>{% ui 'golpo' %}</option><option value="learn" {% if selected.house == 'learn' %}selected{% endif %}>{% ui 'learn' %}</option><option value="interview" {% if selected.house == 'interview' %}selected{% endif %}>{% ui 'interview' %}</option><option value="series" {% if selected.house == 'series' %}selected{% endif %}>{% ui 'series' %}</option><option value="collections" {% if selected.house == 'collections' %}selected{% endif %}>{% ui 'collections' %}</option></select></label>
<label>{% ui 'duration_min' %}<input name="duration_min" type="number" min="0" max="1440" value="{{ selected.duration_min }}"></label>
<label>{% ui 'duration' %}<input name="duration_max" type="number" min="1" max="1440" value="{{ selected.duration_max }}"></label>
<label>{% ui 'level' %}<select name="level"><option value="">{% ui 'all' %}</option><option value="beginner" {% if selected.level == 'beginner' %}selected{% endif %}>{% ui 'beginner' %}</option><option value="intermediate" {% if selected.level == 'intermediate' %}selected{% endif %}>{% ui 'intermediate' %}</option><option value="advanced" {% if selected.level == 'advanced' %}selected{% endif %}>{% ui 'advanced' %}</option></select></label>
<label>{% ui 'topic' %}<input name="topic" maxlength="80" value="{{ selected.topic }}"></label>
<label>{% ui 'access' %}<select name="access"><option value="">{% ui 'all' %}</option><option value="free" {% if selected.access == 'free' %}selected{% endif %}>{% ui 'free' %}</option><option value="paid" {% if selected.access == 'paid' %}selected{% endif %}>{% ui 'pass_required' %}</option></select></label>
<label>{% ui 'recency' %}<input name="recency_days" type="number" min="1" max="36500" value="{{ selected.recency_days }}"></label></div></details>
<div class="actions"><button class="button" type="submit">{% ui 'search' %}</button><a class="button secondary" href="{% url 'web:search' ui_locale %}">{% ui 'clear_filters' %}</a></div></form>
{% if request.user.is_authenticated %}<section data-saved-filters><h2>{% ui 'saved_filters' %}</h2><form id="save-filter-form"><label>{% ui 'filter_name' %}<input name="name" maxlength="80" required></label><button type="submit">{% ui 'save_filter' %}</button></form><div id="saved-filter-list"></div><p id="filter-status" role="status"></p></section>{% endif %}
{% include 'web/includes/cards.html' %}{% endblock %}
